server
{
    listen 80;
    server_name quiz.virtualman.top;
    index index.html index.htm;
    root /www/wwwroot/quiz.virtualman.top;

    include /www/server/panel/vhost/nginx/extension/quiz.virtualman.top/*.conf;

    #REWRITE-START URL重写规则引用
    include /www/server/panel/vhost/rewrite/quiz.virtualman.top.conf;
    #REWRITE-END

    location ~ \.well-known {
        allow all;
    }

    # 静态资源缓存，HTML 走协商缓存
    location ~* \.(js|css|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    access_log  /www/wwwlogs/quiz.virtualman.top.log;
    error_log  /www/wwwlogs/quiz.virtualman.top.error.log;
}
