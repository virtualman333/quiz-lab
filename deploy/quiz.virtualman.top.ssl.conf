# HTTP：仅用于 ACME 校验与 301 跳转
server
{
    listen 80;
    server_name quiz.virtualman.top;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/quiz.virtualman.top;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log  /www/wwwlogs/quiz.virtualman.top.log;
    error_log  /www/wwwlogs/quiz.virtualman.top.error.log;
}

# HTTPS：正式站点
server
{
    listen 443 ssl;
    http2 on;
    server_name quiz.virtualman.top;
    index index.html index.htm;
    root /www/wwwroot/quiz.virtualman.top;

    include /www/server/panel/vhost/nginx/extension/quiz.virtualman.top/*.conf;

    ssl_certificate    /etc/letsencrypt/live/quiz.virtualman.top/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/quiz.virtualman.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    error_page 404 /404.html;

    location ~ \.well-known {
        allow all;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    access_log  /www/wwwlogs/quiz.virtualman.top.log;
    error_log  /www/wwwlogs/quiz.virtualman.top.error.log;
}
