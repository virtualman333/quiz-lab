<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<title>页面不存在 · 测试实验室</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237166F0'/%3E%3Ctext x='32' y='46' font-size='36' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'%3EQ%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(900px 500px at 10% -12%,rgba(113,102,240,.35),transparent 62%),
      radial-gradient(700px 480px at 100% 0%,rgba(157,140,255,.16),transparent 58%),
      linear-gradient(165deg,#0C0B1A,#141232);color:#F4F2FF}
  .box{max-width:460px;text-align:center}
  .code{font-size:clamp(64px,18vw,110px);font-weight:800;line-height:1;letter-spacing:-2px;
    background:linear-gradient(120deg,#7166F0,#9D8CFF,#C9B8FF);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:20px;margin:14px 0 10px}
  p{color:#A9A4CB;font-size:14px;line-height:1.9;margin:0 0 26px}
  a{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:13px;text-decoration:none;
    background:linear-gradient(135deg,#7166F0,#9D8CFF);color:#fff;font-weight:600;font-size:14px;
    box-shadow:0 10px 24px rgba(113,102,240,.35)}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>可能是链接输错了，或者页面已经被移动。<br>回到首页，挑一个测评开始吧。</p>
    <a href="/">← 返回首页</a>
  </div>
</body>
</html>
